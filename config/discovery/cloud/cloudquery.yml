kind: source
spec:
  name: aws
  path: cloudquery/aws
  version: "v26.0.0"
  tables:
    - aws_s3_buckets
  destinations:
    - sqlite
  spec:
    aws_debug: false
    custom_endpoint_url: "http://localhost:4566" # localstack
---
kind: destination
spec:
  name: sqlite
  path: cloudquery/sqlite
  version: "v2.4.10"
  spec:
    connection_string: "./cq_test.db"
