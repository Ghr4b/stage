user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    # primary app - TLS1.2 only, reasonable (if dated) ciphers
    server {
        listen 443 ssl;
        server_name fin-app.internal;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:AES256-SHA256:AES128-SHA256;

        location / {
            return 200 "fin-app: primary (443) - TLS1.2 only\n";
        }
    }

    # admin panel on a second port - noticeably weaker than the primary,
    # to test that the scanner maps AND independently assesses every
    # port on a host rather than assuming one result covers the host.
    server {
        listen 8443 ssl;
        server_name fin-app.internal;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2;
        ssl_ciphers         AES256-SHA:AES128-SHA;

        location / {
            return 200 "fin-app: admin (8443) - weaker cipher selection\n";
        }
    }
}
