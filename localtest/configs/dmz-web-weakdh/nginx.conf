user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    # Weak key + weak DH host: 1024-bit RSA cert and 1024-bit DHE prime
    # (Logjam). Uses nginx:1.18 so the legacy DHE ciphers are still present.
    server {
        listen 443 ssl;
        server_name weak-dh.internal;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2;
        ssl_ciphers         DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA;
        ssl_prefer_server_ciphers on;
        ssl_dhparam         /etc/nginx/certs/dhparam.pem;

        location / {
            return 200 "dmz-web-weakdh: 1024-bit RSA cert + 1024-bit DHE\n";
        }
    }
}