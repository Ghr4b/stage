user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        server_name dmz-web-modern.internal;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;

        # HSTS is present so this host is genuinely "clean" — the scanner
        # should NOT flag it (HSTS-MISSING would otherwise fire).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            return 200 "dmz-web-modern: current TLS1.2/1.3, strong ciphers\n";
        }
    }
}
