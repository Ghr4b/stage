user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    # RC4-only modern-ish host: TLS1.2 with RC4-SHA. Newer nginx/OpenSSL
    # builds have RC4 removed or disabled by default, so this host pins
    # nginx:1.18 (Debian buster, OpenSSL 1.1.1) which still ships RC4.
    server {
        listen 443 ssl;
        server_name dmz-web-rc4.internal;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2;
        ssl_ciphers         RC4-SHA;
        ssl_prefer_server_ciphers on;

        location / {
            return 200 "dmz-web-rc4: TLS1.2 with RC4 ciphers\n";
        }
    }
}